<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/sun-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f59e0b" />
    <meta name="description" content="SolSet - Place and orient a new house by the sun. See the sun's path and real-scale shadows on a map for any date, check shade from neighbours, trees and hills, size window overhangs and estimate rooftop solar production." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://solset.guztia.com/" />
    <meta property="og:title" content="SolSet - Sun path, shadows and solar for siting a house" />
    <meta property="og:description" content="Place and orient a new house by the sun: sun path and real-scale shadows on a map, shade from neighbours, trees and hills, window overhangs and rooftop solar production." />
    <meta property="og:image" content="https://solset.guztia.com/solset-seo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://solset.guztia.com/" />
    <meta name="twitter:title" content="SolSet - Sun path, shadows and solar for siting a house" />
    <meta name="twitter:description" content="Place and orient a new house by the sun: sun path and real-scale shadows on a map, shade from neighbours, trees and hills, window overhangs and rooftop solar production." />
    <meta name="twitter:image" content="https://solset.guztia.com/solset-seo.png" />

    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <title>SolSet — Sun path, shadows &amp; solar for siting a house</title>

    <!-- Apply the saved theme before first paint to avoid a light flash in dark mode -->
    <script>
      try {
        var theme = (JSON.parse(localStorage.getItem('solset_settings')) || {}).theme;
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>SolSet needs JavaScript to show the sun's path and shadows on the map.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
