<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/sun-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f59e0b" />
    <meta name="description" content="SolSet Sun Tracker - Visualize the sun's position and trajectory on an interactive map for any location and date/time. Plan your home orientation and solar installations." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://solset.guztia.com/" />
    <meta property="og:title" content="SolSet - Interactive Sun Position Tracker" />
    <meta property="og:description" content="Visualize the sun's position and trajectory on an interactive map for any location and date/time. Optimize house orientation and solar installations." />
    <meta property="og:image" content="https://solset.guztia.com/solset-seo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://solset.guztia.com/" />
    <meta name="twitter:title" content="SolSet - Interactive Sun Position Tracker" />
    <meta name="twitter:description" content="Visualize the sun's position and trajectory on an interactive map for any location and date/time. Optimize house orientation and solar installations." />
    <meta name="twitter:image" content="https://solset.guztia.com/solset-seo.png" />

    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <title>SolSet — Sun Position Tracker</title>

    <!-- Apply the saved theme before first paint to avoid a light flash in dark mode -->
    <script>
      try {
        var theme = (JSON.parse(localStorage.getItem('solset_settings')) || {}).theme;
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>SolSet needs JavaScript to show the sun's position on the map.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
